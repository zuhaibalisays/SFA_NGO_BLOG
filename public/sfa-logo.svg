<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0F172A"/>
  <!-- Sun/Light rays -->
  <circle cx="100" cy="72" r="22" fill="url(#sunGrad)"/>
  <!-- Rays -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="40" x2="100" y2="30"/>
    <line x1="122" y1="50" x2="130" y2="42"/>
    <line x1="78" y1="50" x2="70" y2="42"/>
    <line x1="130" y1="72" x2="140" y2="72"/>
    <line x1="70" y1="72" x2="60" y2="72"/>
  </g>
  <!-- Open book -->
  <path d="M55 110 Q100 95 100 110 Q100 95 145 110 L145 155 Q100 140 100 155 Q100 140 55 155 Z" fill="white" opacity="0.95"/>
  <!-- Book spine -->
  <line x1="100" y1="105" x2="100" y2="155" stroke="#0F172A" stroke-width="2"/>
  <!-- Page lines left -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.6">
    <line x1="65" y1="120" x2="92" y2="116"/>
    <line x1="65" y1="128" x2="92" y2="124"/>
    <line x1="65" y1="136" x2="92" y2="132"/>
  </g>
  <!-- Page lines right -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.6">
    <line x1="108" y1="116" x2="135" y2="120"/>
    <line x1="108" y1="124" x2="135" y2="128"/>
    <line x1="108" y1="132" x2="135" y2="136"/>
  </g>
  <!-- SFA text -->
  <text x="100" y="182" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="3">SFA</text>
</svg>
